name: Test and publish GitHub Pages

# The main site is on Vercel. This workflow runs the tests on every push
# and publishes the GitHub Pages link in one of two modes:
#
#   PAGES_MODE: static   → a static copy of the site (sign-ups stay on the
#                          phone and are re-sent later). Used while Vercel
#                          is not yet serving the site.
#   PAGES_MODE: redirect → a tiny page that forwards to SITE_URL, so old
#                          links and QR codes land on the Vercel site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_MODE: redirect
  SITE_URL: https://biolane.vercel.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Same build Vercel runs, to catch errors before they reach the site.
      - run: npm run build

      - name: Build static copy for GitHub Pages
        if: env.PAGES_MODE == 'static'
        run: |
          rm -rf app/api .next
          GITHUB_PAGES=true npm run build
          touch out/.nojekyll

      - name: Build redirect page
        if: env.PAGES_MODE == 'redirect'
        run: |
          mkdir -p out
          cat > out/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Biolane Nesting Checklist</title>
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=${SITE_URL}">
            <link rel="canonical" href="${SITE_URL}">
            <script>location.replace("${SITE_URL}")</script>
          </head>
          <body style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1rem">
            <p>The Biolane Nesting Checklist has moved.</p>
            <p><a href="${SITE_URL}">Open the checklist</a></p>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
