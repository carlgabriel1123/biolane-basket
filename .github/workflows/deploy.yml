name: Test, and keep the old GitHub Pages link redirecting

# The site itself is hosted on Vercel. This workflow:
#   1. runs the tests and a production build on every push, and
#   2. publishes a tiny redirect page to GitHub Pages, so any QR code or
#      link that still points at carlgabriel1123.github.io/biolane-basket/
#      lands on the Vercel site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Change this if the Vercel production domain changes.
  SITE_URL: https://biolane-basket.vercel.app/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  redirect:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Biolane Nesting Checklist</title>
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=${SITE_URL}">
            <link rel="canonical" href="${SITE_URL}">
            <script>location.replace("${SITE_URL}")</script>
          </head>
          <body style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1rem">
            <p>The Biolane Nesting Checklist has moved.</p>
            <p><a href="${SITE_URL}">Open the checklist</a></p>
          </body>
          </html>
          HTML
          cp redirect/index.html redirect/404.html
          touch redirect/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

      - id: deployment
        uses: actions/deploy-pages@v4
